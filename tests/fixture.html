<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Demonstração · WhatsApp Compact Sidebar</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#eae6df;color:#18352c}#app{height:100vh;display:flex}.nav{width:60px;flex-shrink:0;background:#e8efeb;display:flex;flex-direction:column;align-items:center;padding-top:20px;gap:24px;color:#346450}.column{width:370px;min-width:300px;flex:0 0 370px;display:flex;flex-direction:column}#side{flex:1 1 0;min-height:0;display:flex;flex-direction:column;background:#fff}header{height:64px;padding:20px;flex-shrink:0;font-size:21px;font-weight:650}.search{padding:12px 20px}.search input{padding:10px;border:0;border-radius:8px;background:#eff4f1;width:100%}.filters{padding:4px 20px 18px;color:#4e7966}#pane-side{overflow:auto;flex:1;min-height:0}.virtual{position:relative;height:1440px}[role=row]{height:72px;width:100%;position:absolute;cursor:pointer}[role=gridcell]{display:flex;align-items:center;padding:12px 16px;height:72px;gap:14px;border-bottom:1px solid #edf2ef}.photo{width:46px;height:46px;flex-shrink:0}.photo img{width:46px;height:46px;border-radius:50%}.copy{flex:1;overflow:hidden}.name{font-weight:600}.preview{margin-top:5px;font-size:13px;color:#657c70;white-space:nowrap}.unread{background:#008b64;color:white;border-radius:20px;padding:3px 7px;font-size:12px}[aria-selected=true]{background:#e4f1e9}#main{flex:1;min-width:0;display:flex;flex-direction:column}#main header{background:#f7faf8;display:flex;align-items:center;gap:14px;font-size:16px}.thread{padding:30px;flex:1;background:radial-gradient(#cad8ce 1px,transparent 1px) 0 0/20px 20px}.notice{text-align:center;font-size:12px;color:#486152;margin-bottom:40px}.bubble{background:white;max-width:450px;padding:16px 20px;border-radius:0 15px 15px;margin:16px 0;box-shadow:0 1px 3px #0001}.reply{background:#d7f8df;margin-left:auto;border-radius:15px 0 15px 15px}footer{padding:18px;background:#f7faf8}footer input{width:100%;padding:14px;border:0;border-radius:10px}.time{font-size:11px;color:#64776b;display:block;text-align:right;margin-top:6px}.demo{font-size:11px;position:absolute;bottom:8px;right:20px;color:#50695c}
@media(prefers-color-scheme:dark){body{color:#e9f3ed;background:#11211b}#side{background:#172a21}.nav,#main header,footer{background:#203a2c}input{background:#294638!important;color:white}.bubble{background:#253e30}.reply{background:#205c42}.notice,.preview,.time{color:#b0c6b8}[aria-selected=true]{background:#254b37}.thread{background:#12231a}.demo{color:#b0c6b8}}
</style>
<div id="app"><nav class="nav" aria-label="Menu"><span>◉</span><span>◌</span><span>♧</span><span>⚙</span></nav><div class="column"><header data-testid="chatlist-header" style="display:flex;gap:12px;white-space:nowrap">Conversas<button type="button" aria-label="Nova conversa">+</button><button type="button" aria-label="Mais opções">⋮</button></header><div id="side"><div class="search"><input aria-label="Pesquisar conversas" placeholder="Pesquisar conversas"></div><div class="filters">Tudo · Não lidas · Grupos</div><div id="pane-side"><button type="button" data-testid="chatlist-panel-archived-button" style="position:relative;left:9px;display:block;width:100%;border:0;background:none;padding:0"><div data-testid="cell-frame-container" style="display:flex;align-items:center;margin:0 10px;height:49px"><div style="display:flex"><div style="display:flex;padding:0 15px 0 13px;width:77px;box-sizing:border-box;justify-content:center"><div style="display:flex;width:49px;justify-content:center"><span style="display:block"><svg id="archived-icon" width="24" height="24" viewBox="0 0 24 24" style="display:block"><rect x="3" y="4" width="18" height="16" rx="3" fill="#8a8"/></svg></span></div></div></div><div style="display:flex;flex:1">Arquivadas</div><div style="display:flex">3</div></div></button><div class="virtual" role="grid"></div></div></div></div><div data-testid="drawer-middle" style="position:absolute;left:600px;top:0;width:300px;height:100vh;border-left:1px solid #0003;pointer-events:none"></div><main id="main"><header><span>🟢</span><span id="contact">Equipe criativa</span></header><div class="thread"><div class="notice">Demonstração com dados fictícios — não é uma sessão do WhatsApp.</div><div class="bubble">Agora a conversa tem mais espaço.<span class="time">09:41</span></div><div class="bubble reply">E as mensagens não lidas aparecem sobre cada foto. ✨<span class="time">09:42 ✓✓</span></div><div class="bubble">Clique nas fotos para testar. Use o botão » para expandir a lista.<span class="time">09:43</span></div></div><footer><input aria-label="Mensagem de demonstração" placeholder="Mensagem de demonstração — não envia nada"></footer></main></div>
<script>
const names=['Equipe criativa','Marina','Lucas','Família','Ana','Viagem','Pedro','Camila','Projetos','Rafael','Julia','Amigos','Design','Bruno','Carla','Comunidade','Lia','Música','Games','Nina'];
const colors=['#8368b0','#ce896d','#4d9e96','#669371','#b96d87'];
for(let i=0;i<20;i++){
 const row=document.createElement('div');row.setAttribute('role','row');row.tabIndex=0;row.style.transform=`translateY(${i*72}px)`;row.dataset.contact=String(i);row.setAttribute('aria-selected',String(i===0));
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60"><rect width="60" height="60" fill="${colors[i%5]}"/><circle cx="30" cy="23" r="11" fill="#fff9"/><ellipse cx="30" cy="55" rx="21" ry="19" fill="#fff9"/></svg>`;
 row.innerHTML=`<div role="gridcell"><div class="photo"><img alt="" src="data:image/svg+xml,${encodeURIComponent(svg)}"></div><div class="copy"><span class="name" title="${names[i]}">${names[i]}</span><div class="preview">Uma mensagem de exemplo</div></div>${i%3===1?`<span class="unread" aria-label="${i+1} mensagens não lidas">${i+1}</span>`:''}</div>`;
 row.addEventListener('click',()=>{document.querySelectorAll('[role=row]').forEach(el=>el.setAttribute('aria-selected','false'));row.setAttribute('aria-selected','true');document.querySelector('#contact').textContent=row.querySelector('.name').textContent;row.querySelector('.unread')?.remove()});
 document.querySelector('.virtual').append(row);
}
</script></html>
