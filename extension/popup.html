<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WhatsApp Compact Sidebar</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><span class="symbol" aria-hidden="true">◧</span><div><h1>Mais conversa.<br>Menos lateral.</h1><p>WhatsApp Compact Sidebar</p></div></header>
  <main>
    <label class="option"><span>Ativar extensão</span><input id="enabled" type="checkbox"></label>
    <label class="option"><span>Mostrar só as fotos</span><input id="compact" type="checkbox"></label>
    <label class="width" for="width">Largura da lateral</label>
    <select id="width"><option value="80">Estreita · 80 px</option><option value="88">Confortável · 88 px</option><option value="104">Espaçosa · 104 px</option></select>
    <p class="hint">Use <kbd>Alt</kbd> + <kbd>Shift</kbd> + <kbd>C</kbd> ou o botão na lateral para expandir e pesquisar conversas.</p>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <footer>Local, sem IA e sem coleta de conversas.<br>Feito para JennIsCoding · v0.1.0</footer>
  <script src="popup.js"></script>
</body></html>
